    <script>
        (function () {
            'use strict';

            const formId = '1';
            const storageKey = 'yolo_attribution_data';
            const cookiePrefix = 'yolo_attr_';
            const retentionMilliseconds = 30 * 24 * 60 * 60 * 1000;
            const retentionSeconds = 30 * 24 * 60 * 60;

            const fieldMap = {
                utm_source: 10,
                utm_medium: 11,
                utm_campaign: 12,
                utm_term: 13,
                utm_content: 14,
                gclid: 15,
                gbraid: 16,
                wbraid: 17,
                original_referrer: 18
            };

            function readStoredAttribution() {
                const storedValue = localStorage.getItem(storageKey);

                if (!storedValue) {
                    return {};
                }

                try {
                    const parsedValue = JSON.parse(storedValue);

                    if (
                        !parsedValue ||
                        typeof parsedValue !== 'object' ||
                        Array.isArray(parsedValue)
                    ) {
                        return {};
                    }

                    const capturedAt = Number(
                        parsedValue.captured_at || 0
                    );

                    if (
                        capturedAt > 0 &&
                        Date.now() - capturedAt > retentionMilliseconds
                    ) {
                        localStorage.removeItem(storageKey);
                        return {};
                    }

                    return parsedValue;
                } catch (error) {
                    localStorage.removeItem(storageKey);
                    return {};
                }
            }

            function writeAttributionCookie(parameter, value) {
                if (!value) {
                    return;
                }

                let cookieValue =
                    cookiePrefix + parameter + '=' +
                    encodeURIComponent(value) +
                    '; path=/' +
                    '; max-age=' + retentionSeconds +
                    '; samesite=lax';

                if (window.location.protocol === 'https:') {
                    cookieValue += '; secure';
                }

                document.cookie = cookieValue;
            }

            function isExternalReferrer(referrer) {
                if (!referrer) {
                    return false;
                }

                try {
                    const referrerUrl = new URL(referrer);
                    return referrerUrl.origin !== window.location.origin;
                } catch (error) {
                    return false;
                }
            }

            function captureAttribution() {
                const attribution = readStoredAttribution();
                const query = new URLSearchParams(
                    window.location.search
                );

                let hasNewCampaignValue = false;

                Object.keys(fieldMap).forEach(function (parameter) {
                    if (!query.has(parameter)) {
                        return;
                    }

                    const value = String(
                        query.get(parameter) || ''
                    ).trim();

                    if (!value) {
                        return;
                    }

                    attribution[parameter] = value;
                    writeAttributionCookie(parameter, value);
                    hasNewCampaignValue = true;
                });

                if (
                    !attribution.original_referrer &&
                    isExternalReferrer(document.referrer)
                ) {
                    attribution.original_referrer = document.referrer;
                    writeAttributionCookie(
                        'original_referrer',
                        document.referrer
                    );
                    hasNewCampaignValue = true;
                }

                if (
                    hasNewCampaignValue ||
                    !Number(attribution.captured_at || 0)
                ) {
                    attribution.captured_at = Date.now();
                }

                try {
                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(attribution)
                    );
                } catch (error) {
                    /**
                     * Cookie and direct form population still work if browser
                     * storage is disabled or unavailable.
                     */
                }

                return attribution;
            }

            function getGravityForms() {
                return Array.from(
                    document.querySelectorAll(
                        [
                            'form[id="gform_' + formId + '"]',
                            'form[id^="gform_' + formId + '_"]',
                            'form[data-formid="' + formId + '"]'
                        ].join(', ')
                    )
                );
            }

            function populateGravityFields() {
                const attribution = captureAttribution();
                const forms = getGravityForms();

                if (!forms.length) {
                    return;
                }

                forms.forEach(function (form) {
                    Object.keys(fieldMap).forEach(function (parameter) {
                        const fieldId = fieldMap[parameter];
                        const field = form.querySelector(
                            'input[name="input_' + fieldId + '"]'
                        );

                        if (!field) {
                            return;
                        }

                        const value = String(
                            attribution[parameter] || ''
                        );

                        if (field.value !== value) {
                            field.value = value;
                        }
                    });
                });
            }

            function initialiseAttributionCapture() {
                populateGravityFields();

                document.addEventListener(
                    'gform/postRender',
                    function (event) {
                        const detail = event && event.detail
                            ? event.detail
                            : {};

                        if (
                            detail.formId &&
                            String(detail.formId) !== formId
                        ) {
                            return;
                        }

                        populateGravityFields();
                    }
                );

                document.addEventListener(
                    'submit',
                    function (event) {
                        const submittedForm = event.target;

                        if (
                            !(submittedForm instanceof HTMLFormElement) ||
                            String(
                                submittedForm.getAttribute('data-formid') ||
                                submittedForm.id.replace('gform_', '')
                            ).split('_')[0] !== formId
                        ) {
                            return;
                        }

                        populateGravityFields();
                    },
                    true
                );

                if (typeof jQuery !== 'undefined') {
                    jQuery(document).on(
                        'gform_post_render',
                        function (event, renderedFormId) {
                            if (String(renderedFormId) === formId) {
                                populateGravityFields();
                            }
                        }
                    );
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener(
                    'DOMContentLoaded',
                    initialiseAttributionCapture
                );
            } else {
                initialiseAttributionCapture();
            }
        })();
    </script>

    <script>
        (function () {
            'use strict';

            function initialiseYoloHighLevelFormModals() {
                const modalConfigs = [
                    {
                        modalId: 'yoloLandingFormModal',
                        triggerSelector: '.yolo-landing-form-trigger'
                    },
                    {
                        modalId: 'yoloBrochureFormModal',
                        triggerSelector: '.yolo-brochure-form-trigger'
                    }
                ];

                const modalStates = modalConfigs.map(function (config) {
                    const modal = document.getElementById(config.modalId);

                    if (!modal) {
                        return null;
                    }

                    return {
                        config: config,
                        modal: modal,
                        closeButton: modal.querySelector(
                            '.yolo-landing-form-close'
                        ),
                        overlay: modal.querySelector(
                            '.yolo-landing-form-overlay'
                        ),
                        previousTrigger: null
                    };
                }).filter(Boolean);

                if (!modalStates.length) {
                    return;
                }

                function focusElement(element) {
                    if (
                        !element ||
                        typeof element.focus !== 'function'
                    ) {
                        return;
                    }

                    try {
                        element.focus({
                            preventScroll: true
                        });
                    } catch (error) {
                        element.focus();
                    }
                }

                function syncBodyLock() {
                    const hasActiveModal = modalStates.some(
                        function (state) {
                            return state.modal.classList.contains(
                                'is-active'
                            );
                        }
                    );

                    document.body.classList.toggle(
                        'yolo-landing-form-open',
                        hasActiveModal
                    );
                }

                function closeModal(state, restoreFocus) {
                    if (
                        !state ||
                        !state.modal.classList.contains('is-active')
                    ) {
                        return;
                    }

                    state.modal.classList.remove('is-active');
                    state.modal.setAttribute('aria-hidden', 'true');

                    syncBodyLock();

                    if (restoreFocus !== false) {
                        focusElement(state.previousTrigger);
                    }
                }

                function closeOtherModals(activeState) {
                    modalStates.forEach(function (state) {
                        if (state !== activeState) {
                            closeModal(state, false);
                        }
                    });
                }

                function openModal(state, trigger) {
                    if (!state) {
                        return;
                    }

                    closeOtherModals(state);

                    state.previousTrigger = trigger || null;
                    state.modal.classList.add('is-active');
                    state.modal.setAttribute('aria-hidden', 'false');

                    syncBodyLock();
                    focusElement(state.closeButton);
                }

                /*
                 * One delegated listener handles both trigger classes.
                 * This keeps Salient buttons and dynamically rendered buttons
                 * working without changing the existing website markup logic.
                 */
                document.addEventListener('click', function (event) {
                    if (!(event.target instanceof Element)) {
                        return;
                    }

                    let matchedState = null;
                    let matchedTrigger = null;

                    modalStates.some(function (state) {
                        const trigger = event.target.closest(
                            state.config.triggerSelector
                        );

                        if (!trigger) {
                            return false;
                        }

                        matchedState = state;
                        matchedTrigger = trigger;
                        return true;
                    });

                    if (!matchedState || !matchedTrigger) {
                        return;
                    }

                    event.preventDefault();
                    openModal(matchedState, matchedTrigger);
                });

                modalStates.forEach(function (state) {
                    if (state.closeButton) {
                        state.closeButton.addEventListener(
                            'click',
                            function () {
                                closeModal(state, true);
                            }
                        );
                    }

                    if (state.overlay) {
                        state.overlay.addEventListener(
                            'click',
                            function () {
                                closeModal(state, true);
                            }
                        );
                    }
                });

                document.addEventListener('keydown', function (event) {
                    if (event.key !== 'Escape') {
                        return;
                    }

                    const activeState = modalStates.find(
                        function (state) {
                            return state.modal.classList.contains(
                                'is-active'
                            );
                        }
                    );

                    if (activeState) {
                        closeModal(activeState, true);
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener(
                    'DOMContentLoaded',
                    initialiseYoloHighLevelFormModals
                );
            } else {
                initialiseYoloHighLevelFormModals();
            }
        })();
    </script>
